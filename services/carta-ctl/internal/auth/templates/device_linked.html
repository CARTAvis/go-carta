<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Device linked</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; background: #f4f5f7; }
      .card { background: #fff; padding: 2rem 2.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center; max-width: 24rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Device linked</h1>
      <p>Your device has been linked to the account <strong>{{ .Username }}</strong>.</p>
      <p>You can now close this window.</p>
    </div>
  </body>
</html>
